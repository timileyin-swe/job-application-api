name: Daily portfolio review
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-portfolio.yml']
permissions: {}
concurrency: daily-portfolio-review
jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.queue.outputs.number }}
      head: ${{ steps.queue.outputs.head }}
    steps:
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          candidate=$(gh pr list --repo "$REPO" --base main --limit 100 --json labels,number,headRefName,headRefOid,isCrossRepository,author |
            jq -c --arg owner "$OWNER" '[.[] | select((all(.labels[]; .name != "cloud-tested")) and .author.login == $owner and (.isCrossRepository | not) and (.headRefName | startswith("portfolio/")))] | sort_by(.number) | first // empty')
          if [[ -n "$candidate" ]]; then
            echo "number=$(jq -r .number <<< "$candidate")" >> "$GITHUB_OUTPUT"
            echo "head=$(jq -r .headRefOid <<< "$candidate")" >> "$GITHUB_OUTPUT"
          else
            echo "No prepared drafts in the queue." >> "$GITHUB_STEP_SUMMARY"
          fi
  test:
    needs: select
    if: needs.select.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.select.outputs.number }}/merge
          persist-credentials: false
          fetch-depth: 2
      - name: Verify candidate revision
        env:
          EXPECTED: ${{ needs.select.outputs.head }}
        run: test "$(git rev-parse HEAD^2)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  review:
    needs: [select, test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label the tested contribution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.select.outputs.number }}
          EXPECTED: ${{ needs.select.outputs.head }}
        run: |
          test "$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)" = "$EXPECTED"
          gh api --method POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=cloud-tested'
